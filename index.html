<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Expenditure System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20260908">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>

<body>

    <!-- ======================================== -->
    <!-- MAIN APP (No Login, No Supabase) -->
    <!-- ======================================== -->
    <div id="mainApp" class="app-wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <h1>📡 EXPENDITURE SYSTEM</h1>
                <span class="subtitle">GENERAL CONNECTION EXPENDITURE</span>
                <button id="themeToggle" class="btn btn-theme">🌙 Dark</button>
            </div>
            <div class="filter-panel">
                <label>📅 From</label>
                <input type="date" id="dateFrom" class="date-input">
                <label>To</label>
                <input type="date" id="dateTo" class="date-input">
                <button id="applyFilterBtn" class="btn btn-filter">🔍 Apply</button>
                <button id="clearFilterBtn" class="btn btn-filter">✕ Clear</button>
                <button id="printPdfBtn" class="btn btn-pdf">📄 PDF</button>
            </div>
        </header>

        <!-- MAIN -->
        <main>

            <!-- SEARCH BAR -->
            <div class="search-bar-row">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by transaction code...">
                    <button id="clearSearchBtn" class="search-clear-btn" style="display:none;">✕</button>
                </div>
                <div id="searchResultInfo" class="search-result-info"></div>
            </div>

            <!-- TABLE -->
            <div class="table-container">
                <div id="tableWrapper" class="table-responsive"></div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="action-row">
                <button id="addDateBtn" class="btn btn-add">➕ Add New Date Entry</button>
                <button id="addRowBtn" class="btn btn-add-secondary">➕ Add Transaction Row</button>
            </div>

            <!-- TOTALS -->
            <div class="totals-grid">
                <div class="total-card" id="grandTotalCard">
                    <span class="total-label">💰 GRAND TOTAL</span>
                    <span class="total-value" id="grandTotal">0.00</span>
                </div>
                <div class="total-card" id="transactionFeesDisplay">
                    <span class="total-label">💳 TRANSACTION FEES</span>
                    <span class="total-value" id="transactionFeesTotal">0.00</span>
                </div>
            </div>

            <p class="hint">* Enter amounts in any field — totals update automatically.</p>

        </main>

    </div>

    <!-- ======================================== -->
    <!-- READ MORE MODAL -->
    <!-- ======================================== -->
    <div id="readMoreModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📄 Full Description</h3>
                <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- ======================================== -->
    <!-- MADE BY B - WHATSAPP BUTTON -->
    <!-- ======================================== -->
    <a href="https://wa.me/254759592457?text=Hello%20B%2C%20I%20am%20interested%20in%20the%20Expenditure%20System" target="_blank" rel="noopener" class="made-by-btn" id="madeByBtn">
        <i class="fab fa-whatsapp"></i>
        <span>Made by Rein</span>
        <i class="fas fa-arrow-right"></i>
    </a>

    <script src="script.js"></script>
</body>

</html>
